# Every response carries these. nginx drops the server's add_header lines in a
# location that has its own, so each such location includes this file again.

# The staff dashboard has no business in a search index.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# Nobody embeds this page in another site.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# The build emits scripts, styles and images as files on this origin, and the
# dashboard talks only to its own /api, the live stream included, so nothing
# needs another source. Styles are the one exception to 'self': the scroll lock
# of Radix's Select (react-remove-scroll) writes a <style> element at runtime,
# and a static file cannot carry a nonce for it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Ignored over plain HTTP; takes effect once TLS sits in front of the container.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
