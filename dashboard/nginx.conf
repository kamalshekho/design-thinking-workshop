# Each Application sends a confirmation mail, so one client address may post
# ten in a row and then one a minute (`A26`). The key is empty for every other
# request, and nginx does not count an empty key. The dashboard proxies the
# same API as the form, so posting through it must not get round the limit.
map "$request_method:$uri" $application_limit_key {
  ~^POST:/api/v1/applications/?$ $binary_remote_addr;
  default "";
}
limit_req_zone $application_limit_key zone=applications:1m rate=1r/m;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

 # no buffering
  location /api/v1/staff/events {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  location /api/ {
    limit_req zone=applications burst=9 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
