spring.application.name=volunteer-form-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/volunteer_form}
spring.datasource.username=${DB_USERNAME:volunteer_form}
spring.datasource.password=${DB_PASSWORD:volunteer_form}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# resend.api-key deliberately has no line here: Spring Boot binds the
# RESEND_API_KEY environment variable to it automatically (relaxed binding),
# and an *absent* property is what makes NoopEmailSender take over instead of
# ResendEmailSender (see @ConditionalOnProperty on each). A default of "" here
# would count as "set" and route real requests through an empty key.
# See backend/README.md, "Transactional email", for how to get a key.
resend.from=${RESEND_FROM:onboarding@resend.dev}

# The throttle counts failed sign-ins per address (A20), and both nginx configs
# already send X-Forwarded-For. Without this, every request would arrive with
# the reverse proxy's address, so five wrong passwords from one person would
# lock out all five staff members.
server.forward-headers-strategy=framework

sign-in.inactivity=12h
sign-in.attempt-limit=5
sign-in.attempt-window=15m

# One initial password per seeded account (A17). Unset here on purpose: the
# placeholder makes the variable's name discoverable, and StaffSeeder refuses
# to start rather than invent one — but only for an account it actually has to
# create, so an already-seeded deployment needs none of these.
staff.seed-passwords[0]=${STAFF_1_PASSWORD:}
staff.seed-passwords[1]=${STAFF_2_PASSWORD:}
staff.seed-passwords[2]=${STAFF_3_PASSWORD:}
staff.seed-passwords[3]=${STAFF_4_PASSWORD:}
staff.seed-passwords[4]=${STAFF_5_PASSWORD:}
