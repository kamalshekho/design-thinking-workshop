spring.application.name=volunteer-form-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/volunteer_form}
spring.datasource.username=${DB_USERNAME:volunteer_form}
# No default on purpose: a password written here would be the one every
# deployment that forgets to set its own runs on. DatabasePasswordRequired stops
# the start when DB_PASSWORD is missing.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GET /actuator/health is for the container healthcheck and the only endpoint
# SecurityConfig opens. It answers UP or DOWN, including the database, and no
# details. Both lines restate Spring Boot's defaults, so a changed default in a
# later version cannot widen what is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Lets a reorder of every Category reach the database as one batch of updates
# rather than one round trip per Category.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# resend.api-key deliberately has no line here: Spring Boot binds the
# RESEND_API_KEY environment variable to it automatically (relaxed binding),
# and an *absent* property is what makes NoopEmailSender take over instead of
# ResendEmailSender (see @ConditionalOnProperty on each). A default of "" here
# would count as "set" and route real requests through an empty key.
# See backend/README.md, "Transactional email", for how to get a key.
resend.from=${RESEND_FROM:onboarding@resend.dev}

# The throttle counts failed sign-ins per address (A20). Both nginx configs set
# X-Forwarded-For to the address nginx itself sees ($remote_addr) and overwrite
# whatever the client sent, so a client cannot pick the address it is counted
# under. Without this, every request would arrive with the reverse proxy's
# address, so five wrong passwords from one person would lock out all five
# staff members.
server.forward-headers-strategy=framework

# Each Application sends a confirmation email to the address it names, so one
# email address may submit three in 24 hours before answering 429 (A26).
application-limit.per-email=3
application-limit.window=24h

sign-in.inactivity=12h
sign-in.attempt-limit=5
sign-in.attempt-window=15m

# One initial password per seeded account (A17). Unset here on purpose: the
# placeholder makes the variable's name discoverable, and StaffSeeder refuses
# to start rather than invent one — but only for an account it actually has to
# create, so an already-seeded deployment needs none of these.
staff.seed-passwords[0]=${STAFF_1_PASSWORD:}
staff.seed-passwords[1]=${STAFF_2_PASSWORD:}
staff.seed-passwords[2]=${STAFF_3_PASSWORD:}
staff.seed-passwords[3]=${STAFF_4_PASSWORD:}
staff.seed-passwords[4]=${STAFF_5_PASSWORD:}
