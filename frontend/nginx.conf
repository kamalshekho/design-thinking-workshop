# Each Application sends a confirmation mail, so one client address may post
# ten in a row and then one a minute (`A26`). The key is empty for every other
# request, and nginx does not count an empty key.
map "$request_method:$uri" $application_limit_key {
  ~^POST:/api/v1/applications/?$ $binary_remote_addr;
  default "";
}
limit_req_zone $application_limit_key zone=applications:1m rate=1r/m;

map "$request_method:$uri" $onboarding_limit_key {
  ~^(GET|PUT):/api/onboarding/ $binary_remote_addr;
  default "";
}
limit_req_zone $onboarding_limit_key zone=onboarding:1m rate=30r/m;

map "$request_uri:$http_referer" $loggable {
  ~(/api)?/onboarding/ 0;
  default 1;
}

# One pool of open connections to the backend. Without it nginx opens a new
# TCP connection per request, and at about 600 requests a second the closed
# ones in TIME_WAIT use up the local ports: the load test in
# `load-test/RESULTS.md` saw half the requests answered with 502.
upstream backend_api {
  server backend:8080;
  keepalive 32;
}

# Serves the form and proxies the API from one origin, so no CORS applies.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log main if=$loggable;
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Same origin as the form, which is what removes CORS from the picture.

  location /api/ {
    limit_req zone=applications burst=9 nodelay;
    limit_req zone=onboarding burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Fingerprinted by the build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Not fingerprinted and not for shared caches.
  location /fonts/ {
    expires 30d;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "private, max-age=2592000" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
