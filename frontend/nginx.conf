# Serves the form and proxies the API from one origin, so no CORS applies.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reinforces the meta tag in index.html for crawlers that only read headers.
  # The prototype carries another organisation's branding and must not be
  # indexed as if it were their site.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  # Nobody embeds this page in another site.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Needed because the upstream below is a variable.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same origin as the form, which is what removes CORS from the picture.
  #
  # The upstream is held in a variable on purpose: nginx then resolves it per
  # request instead of at startup, so the form still serves when the backend is
  # absent. A literal upstream makes nginx refuse to start without it, which
  # would couple the form's availability to a service that does not exist yet.
  location /api/ {
    set $upstream "backend:8080";
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Fingerprinted by the build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Not fingerprinted and not for shared caches.
  location /fonts/ {
    expires 30d;
    add_header Cache-Control "private, max-age=2592000" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
