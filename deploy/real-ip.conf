# Mounted into both nginx containers on the server only, next to default.conf,
# so it applies at the http level.
#
# Behind Caddy every request reaches nginx from Caddy's container address. The
# per-address limits in nginx.conf (A26) and the backend's sign-in throttle
# (A20) would then count every applicant and every staff member as one client.
# nginx takes the client address from X-Forwarded-For instead, but only when
# the request comes from a private address: on the server no nginx port is
# published, so only containers in the Compose network, that is Caddy, can
# reach it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
