# Decision, "Dependabot": https://github.com/kamalshekho/design-thinking-workshop/issues/112#issuecomment-7102714144
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown
version: 2

updates:
  # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#group-by-groups
  - package-ecosystem: npm
    directories:
      - /frontend
      - /dashboard
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      shared-tools:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - eslint
          - '@eslint/js'
          - typescript
          - typescript-eslint
          - prettier
          - eslint-plugin-jsx-a11y
          - eslint-plugin-react-hooks
          - eslint-plugin-react-refresh
          - eslint-plugin-simple-import-sort
          - eslint-plugin-boundaries
          - eslint-import-resolver-typescript
          - globals
          - size-limit
          - '@size-limit/file'
          - husky
          - lint-staged
          - knip
          - jscpd
          - eslint-plugin-sonarjs
          - '@eslint-community/eslint-plugin-eslint-comments'
          - eslint-plugin-check-file
          - '@stylistic/eslint-plugin'
          - '@vitest/coverage-v8'
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
