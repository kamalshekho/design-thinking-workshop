name: codeql

# Decision, "CodeQL": https://github.com/kamalshekho/design-thinking-workshop/issues/112#issuecomment-7102714144
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # The repo is public and uses no private CodeQL packs, so neither
    # `actions: read` nor `packages: read` is needed:
    # https://github.com/actions/starter-workflows/blob/e3c451d60f119b71caebf13c98ac45da6e15b4b7/code-scanning/codeql.yml#L31-L40
    permissions:
      contents: read
      security-events: write # upload the results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
