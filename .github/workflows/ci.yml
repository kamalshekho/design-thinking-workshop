name: ci

# Decision, "Ein Workflow mit Gate": https://github.com/kamalshekho/design-thinking-workshop/issues/112#issuecomment-7102714144
on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks on a version tag before it builds images.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the filter lists a pull request's files via the API
    # A tag has no diff to filter, so on a tag every check runs, except e2e:
    # release.yml runs it against the images it built instead.
    outputs:
      frontend: ${{ github.ref_type == 'tag' && 'true' || steps.filter.outputs.frontend }}
      dashboard: ${{ github.ref_type == 'tag' && 'true' || steps.filter.outputs.dashboard }}
      config: ${{ github.ref_type == 'tag' && 'true' || steps.filter.outputs.config }}
      e2e: ${{ github.ref_type == 'tag' && 'false' || steps.filter.outputs.e2e }}

    steps:
      # https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md?plain=1#L35-L45
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'eslint.base.mjs'
              - '.prettierrc.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - 'eslint.base.mjs'
              - '.prettierrc.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            config:
              - 'frontend/**'
              - 'dashboard/**'
              - 'eslint.base.mjs'
              - '.prettierrc.json'
              - 'scripts/**'
              - '.github/**'
            e2e:
              - 'frontend/**'
              - 'dashboard/**'
              - 'backend/**'
              - 'e2e/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  # Decision, "Jobs je Anwendung": https://github.com/kamalshekho/design-thinking-workshop/issues/112#issuecomment-7102714144
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # https://github.com/actions/setup-node/blob/949feb2413d6458794dcd2491c4babbbce0c15c1/README.md?plain=1#L168
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/.nvmrc') }}

      - name: Install
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run stylelint

      - name: Check unused tokens
        run: npm run check:tokens

      - name: Check token.json primitives
        run: npm run check:token-json

      - name: Check dead code
        run: npm run knip

      - name: Check exports only tests use
        run: npm run knip:production

      - name: Check duplicates
        run: npm run jscpd

      - name: Check formatting
        run: npm run format:check

      - name: Test
        id: test
        run: npm test -- --coverage

      - name: Upload coverage report on failure
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - name: Upload build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dashboard/node_modules
          key: dashboard-node-modules-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json', 'dashboard/.nvmrc') }}

      - name: Install
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check third-party licences
        run: npm run check:licenses

      - name: Check dead code
        run: npm run knip

      - name: Check exports only tests use
        run: npm run knip:production

      - name: Check duplicates
        run: npm run jscpd

      - name: Check formatting
        run: npm run format:check

      - name: Test
        id: test
        run: npm test -- --coverage

      - name: Upload coverage report on failure
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-coverage
          path: dashboard/coverage
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - name: Upload build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the apps' Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Check config parity
        run: node scripts/check-config-parity.mjs

      - name: Lint workflows with actionlint
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      # https://github.com/zizmorcore/zizmor-action/blob/1b4550e929643b8b26a62303c6bd64814271a4f1/README.md?plain=1#L339
      # https://github.com/zizmorcore/zizmor-action/blob/1b4550e929643b8b26a62303c6bd64814271a4f1/action.sh#L40-L45
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate stack credentials
        run: |
          : > .env
          for name in DB_PASSWORD STAFF_1_PASSWORD STAFF_2_PASSWORD \
                      STAFF_3_PASSWORD STAFF_4_PASSWORD STAFF_5_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
            if [ "$name" = "STAFF_1_PASSWORD" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
          echo "RESEND_API_KEY=" >> .env

      - name: Start Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install Playwright browsers
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Typecheck E2E tests
        working-directory: e2e
        run: npm run typecheck

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > e2e/docker-compose.log

      - name: Upload E2E report and logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/docker-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  ci:
    needs: [changes, frontend, dashboard, config, e2e]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the jobs it needs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null
