name: release

# Turns a version tag into images in GitHub Container Registry:
#
#   lint and unit tests -> build -> scan -> push sha-<commit> -> e2e -> tag vX.Y.Z
#
# The version tag is added only by the last job, so an image tagged vX.Y.Z has
# passed every step before it. deploy.yml relies on that and deploys nothing
# else. The demo server is Arm (deploy/README.md), so the images are built for
# linux/arm64 on an Arm runner.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  backend:
    uses: ./.github/workflows/backend.yml
    permissions:
      contents: read
      # backend.yml asks for it to comment coverage on a pull request. A tag
      # run has no pull request, so nothing is written.
      pull-requests: write

  image:
    needs: [checks, backend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write # signs the provenance attestation
      attestations: write
    strategy:
      matrix:
        app: [backend, frontend, dashboard]
    env:
      APP: ${{ matrix.app }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: >-
          docker build --pull
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "org.opencontainers.image.version=$GITHUB_REF_NAME"
          --tag "$IMAGE:sha-$GITHUB_SHA" "$APP"

      # Before the push, so an image with a known fix for a high or critical
      # vulnerability never reaches the registry.
      - name: Scan with Trivy
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          "$IMAGE:sha-$GITHUB_SHA"

      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --quiet "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The same end-to-end tests as the e2e job in ci.yml, run against the pushed
  # images instead of a build from source.
  e2e:
    needs: image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      COMPOSE_FILE: docker-compose.yml:deploy/compose.images.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Generate stack credentials
        run: |
          : > .env
          for name in DB_PASSWORD STAFF_1_PASSWORD STAFF_2_PASSWORD \
                      STAFF_3_PASSWORD STAFF_4_PASSWORD STAFF_5_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
            if [ "$name" = "STAFF_1_PASSWORD" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
          echo "RESEND_API_KEY=" >> .env

      - name: Start Compose stack
        run: docker compose up --detach --wait --wait-timeout 300

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          # No cache in a release: a poisoned cache entry could reach it.
          package-manager-cache: false

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install Playwright browsers
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > e2e/docker-compose.log

      - name: Upload E2E report and logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-e2e-failure-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/docker-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  promote:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      # imagetools copies the manifest as it is, so the version tag points at
      # the same digest the attestation was made for.
      - name: Tag the tested images with the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for app in backend frontend dashboard; do
            image="ghcr.io/$GITHUB_REPOSITORY/$app"
            docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$image:sha-$GITHUB_SHA"
          done
