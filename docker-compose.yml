# database, frontend and backend
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: volunteer_form
      POSTGRES_USER: volunteer_form
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U volunteer_form -d volunteer_form' ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: ichbinhier-volunteer-form-service:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/volunteer_form
      DB_USERNAME: volunteer_form
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      # Passed through empty rather than required with `:?`: whether a missing
      # password is fatal is StaffSeeder's call, and it only refuses to start
      # for an account it still has to create (A17).
      STAFF_1_PASSWORD: ${STAFF_1_PASSWORD:-}
      STAFF_2_PASSWORD: ${STAFF_2_PASSWORD:-}
      STAFF_3_PASSWORD: ${STAFF_3_PASSWORD:-}
      STAFF_4_PASSWORD: ${STAFF_4_PASSWORD:-}
      STAFF_5_PASSWORD: ${STAFF_5_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ichbinhier-form:local
    ports:
      - '8081:80'
    depends_on:
      - backend
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    image: ichbinhier-dashboard:local
    ports:
      - '8082:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
